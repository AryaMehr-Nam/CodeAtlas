name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CodeAtlas and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests demo

      - name: Check formatting with Ruff
        run: ruff format --check src tests demo

      - name: Type-check with mypy
        run: mypy src

      - name: Run test suite
        run: pytest -v

      - name: CLI smoke checks on demo/sample_saas
        run: |
          codeatlas --version
          codeatlas scan demo/sample_saas
          codeatlas export demo/sample_saas --format llms --output /tmp/llms.txt
          codeatlas export demo/sample_saas --format html --output /tmp/atlas.html
          test -s /tmp/llms.txt
          test -s /tmp/atlas.html
