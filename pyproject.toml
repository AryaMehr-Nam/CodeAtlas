[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Static architecture mapper, dependency graph analyzer, and interactive codebase explorer."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pathspec>=0.12",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-go>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
codeatlas = "codeatlas.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codeatlas.ui" = ["*.html", "*.css", "*.js"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "tree_sitter",
    "tree_sitter.*",
    "tree_sitter_python",
    "tree_sitter_python.*",
    "tree_sitter_javascript",
    "tree_sitter_javascript.*",
    "tree_sitter_typescript",
    "tree_sitter_typescript.*",
    "tree_sitter_php",
    "tree_sitter_php.*",
    "tree_sitter_go",
    "tree_sitter_go.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
